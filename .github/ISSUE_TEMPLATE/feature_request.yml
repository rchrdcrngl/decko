name: Feature request
description: Propose a new feature or improvement
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? API sketch welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "@deckohq/core schema"
        - "@deckohq/core registry"
        - "@deckohq/core templates"
        - "decko renderer"
        - "decko browser runtime"
        - "decko CLI"
        - "decko-agent (Python)"
        - "other"
    validations:
      required: true
